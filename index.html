<script>
const MAGIC = new TextEncoder().encode('PICR');
const VERSION = 1;
let piHexCache = null; // string of hex digits
const PI_HEX_DIGITS_NEEDED = 16384; // hex digits

// --- Utilities ---
function ab2hex(buf) { return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hex2ab(hex) { if(hex.length%2!==0) hex='0'+hex; const u8=new Uint8Array(hex.length/2); for(let i=0;i<u8.length;i++) u8[i]=parseInt(hex.substr(i*2,2),16); return u8.buffer; }
function xor(a,b){ const ua=new Uint8Array(a), ub=new Uint8Array(b); const out=new Uint8Array(ua.length); for(let i=0;i<ua.length;i++) out[i]=ua[i]^ub[i]; return out.buffer; }
function concatArrayBuffers(buf1, buf2) {
  const tmp = new Uint8Array(buf1.byteLength + buf2.byteLength);
  tmp.set(new Uint8Array(buf1), 0);
  tmp.set(new Uint8Array(buf2), buf1.byteLength);
  return tmp.buffer;
}

// --- Pi hex generation via Machin formula ---
function arctan_scaled(x, scale, precisionBits) {
  let sum = 0n;
  let x_pow = BigInt(x); // x^(1)
  let k = 0n;
  // 必要なビット数（hex 桁数 * 4）に少し余裕を持たせる
  const limit = BigInt(precisionBits);
  while (true) {
    const denom = x_pow * (2n*k+1n);
    const term = scale / denom;   // 切り捨て除算
    if (term === 0n) break;       // これ以上寄与がないとき終了
    if (Number(k%2n) === 0) sum += term;
    else sum -= term;
    // 次の項へ: x_pow *= x^2
    x_pow *= BigInt(x) * BigInt(x);
    k += 1n;
    // 安全策：イテレーション数が大きくなりすぎたら強制終了
    if (k > 10n * limit) break;
  }
  return sum;
}
async function generatePiHexDigits(N) {
  if (piHexCache && piHexCache.length >= N) return piHexCache.slice(0, N);

  // N 個の 16進桁 = N*4 ビット。誤差を吸収するために +8 ビット余裕を持たせる
  const precisionBits = N * 4 + 8;
  const scale = BigInt(16) ** BigInt(N);

  const a5  = arctan_scaled(5,  scale, precisionBits);
  const a239= arctan_scaled(239, scale, precisionBits);

  let pi_scaled = (16n * a5) - (4n * a239); // これで 16^N * π の整数近似
  // 16進文字列に変換（符号は絶対に出ないはずだが、念のため）
  let hex = pi_scaled.toString(16);
  if (hex.startsWith('-')) hex = hex.slice(1);
  // 必要な長さに合わせてパッドまたは切り詰め
  if (hex.length < N) hex = '0'.repeat(N - hex.length) + hex;
  else if (hex.length > N) hex = hex.slice(0, N);

  piHexCache = hex;
  return piHexCache;
}

// Initialize pi hex at startup
let piReady = false;
(async () => {
  await generatePiHexDigits(PI_HEX_DIGITS_NEEDED);
  piReady = true;
  // ボタンを有効にする（必要なら）
  document.querySelectorAll('button').forEach(b => b.disabled = false);
  console.log('Pi hex generated, length:', piHexCache.length);
})();

// --- AES-GCM + PBKDF2 ---
async function deriveKey(password, salt, iterations=600000) {
  const enc = new TextEncoder();
  const pwdKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']
  );
  const keyBits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:salt, iterations:iterations, hash:'SHA-256'},
    pwdKey, 256
  );
  return await crypto.subtle.importKey('raw', keyBits, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
function encryptAES(key, iv, plaintext, header) {
  return crypto.subtle.encrypt(
    {name:'AES-GCM', iv:iv, additionalData:header},
    key, plaintext
  );
}
function decryptAES(key, iv, ciphertext, header) {
  return crypto.subtle.decrypt(
    {name:'AES-GCM', iv:iv, additionalData:header},
    key, ciphertext
  );
}

// --- File header ---
function makeHeader(mode, flags, saltOrZero, ivOrZero) {
  const hdr = new Uint8Array(4+1+1+1+16+12); // MAGIC + version + mode + flags + salt + iv
  hdr.set(MAGIC,0);
  hdr[4]=VERSION;
  hdr[5]=mode;
  hdr[6]=flags;
  if(saltOrZero) hdr.set(new Uint8Array(saltOrZero),7);
  if(ivOrZero) hdr.set(new Uint8Array(ivOrZero),7+16);
  return hdr.buffer;
}
function parseHeader(buf) {
  const u8=new Uint8Array(buf);
  if(!u8.slice(0,4).every((v,i)=>v===MAGIC[i])) throw new Error('Invalid magic');
  return {
    version:u8[4],
    mode:u8[5],
    flags:u8[6],
    salt:u8.slice(7,23),
    iv:u8.slice(23,35)
  };
}

// --- Mode A (Pi XOR) ---
function encryptPiXOR(data, offset) {
  if(!piHexCache) throw new Error('Pi hex not ready');
  const need = data.byteLength * 2; // each byte uses 2 hex digits
  const start = offset * 2;
  if(start + need > piHexCache.length) throw new Error('Insufficient pi digits for given offset and length');
  const ks = [];
  for(let i=0;i<data.byteLength;i++){
    const hex = piHexCache.substr(start + i*2, 2);
    ks.push(parseInt(hex,16));
  }
  return xor(data, new Uint8Array(ks).buffer);
}
function decryptPiXOR(data, offset) { return encryptPiXOR(data,offset); } // symmetric

// --- Mode C (composition) ---
async function encryptModeC(plaintext, password, offset, order) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  if(order === 'AthenB'){
    // inner A (Pi XOR) then outer B (AES-GCM)
    const piResult = encryptPiXOR(plaintext, offset);
    const headerAES = makeHeader(2,0,salt,iv); // mode=2, flags=0
    const ciphertextAES = await encryptAES(key, iv, piResult, headerAES);
    return {header: headerAES, ciphertext: ciphertextAES};
  }else{
    // inner B then outer A
    const headerAES = makeHeader(2,0,salt,iv); // temporary header for AES encryption
    const ciphertextAES = await encryptAES(key, iv, plaintext, headerAES);
    const piResult = encryptPiXOR(ciphertextAES, offset);
    const headerFinal = makeHeader(2,1,salt,iv); // mode=2, flags=1
    return {header: headerFinal, ciphertext: piResult};
  }
}
async function decryptModeC(ciphertextWithHeader, password, offset) {
  const hdr = parseHeader(ciphertextWithHeader);
  if(hdr.mode !== 2) throw new Error('Not mode C');
  const salt = hdr.salt;
  const iv = hdr.iv;
  const key = await deriveKey(password, salt);
  const payload = ciphertextWithHeader.slice(35); // after header
  let plain;
  if(hdr.flags === 0){
    // AthenB: inner A then outer B => decrypt AES first then Pi XOR
    const aesDec = await decryptAES(key, iv, payload, ciphertextWithHeader.slice(0,35));
    plain = encryptPiXOR(aesDec, offset); // Pi XOR decrypt
  }else{
    // BthenA: inner B then outer A => Pi XOR first then AES decrypt
    const piDec = encryptPiXOR(payload, offset); // Pi XOR decrypt
    plain = await decryptAES(key, iv, piDec, ciphertextWithHeader.slice(0,35));
  }
  return plain;
}

// --- UI Logic ---
function log(elem,msg){ elem.textContent += msg + '\n'; elem.scrollTop = elem.scrollHeight; }
function showPanel(mode){ document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.getElementById('panel'+mode).classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelector(`.tab[data-mode="${mode}"]`).classList.add('active'); }
function setProgress(panelId, percent){
  const prog = document.getElementById(panelId);
  const bar = prog.querySelector('.progress-bar');
  prog.style.display = percent===0||percent===100 ? 'none' : 'block';
  bar.style.width = percent + '%';
}
function readFileAsArrayBufferWithProgress(file, onProgress){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    const chunkSize = 1024 * 1024; // 1MB
    let offset = 0;
    const chunks = [];
    reader.onerror = ()=>reject(reader.error);
    reader.onabort = ()=>reject(new Error('Aborted'));
    function loadNext(){
      const blob = file.slice(offset, offset+chunkSize);
      reader.readAsArrayBuffer(blob);
    }
    reader.onload = (e)=>{
      chunks.push(new Uint8Array(e.target.result));
      offset += chunkSize;
      const percent = Math.min(100, Math.round((offset/file.size)*100));
      onProgress(percent);
      if(offset < file.size){
        loadNext();
      }else{
        // concatenate
        let total = 0;
        for(const c of chunks) total += c.length;
        const merged = new Uint8Array(total);
        let pos = 0;
        for(const c of chunks){
          merged.set(c, pos);
          pos += c.length;
        }
        resolve(merged.buffer);
      }
    };
    loadNext();
  });
}

// Mode B
document.getElementById('encB').onclick=async()=>{
  if (!piReady) { alert('Pi ヘックス列の生成がまだ完了していません。しばらくお待ちください。'); return; }

  try{
    const arrayBuf = await readFileAsArrayBufferWithProgress(file, p=>setProgress('progressB',p));
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const header=makeHeader(1,0,salt,iv); // modeB=1
    const key=await deriveKey(pwd,salt);
    const ct=await encryptAES(key,iv,arrayBuf,header);
    setProgress('progressB',100);
    const blob=new Blob([header,ct]);
    const url=URL.createObjectURL(blob);
    const a=document.getElementById('dlB');
    a.href=url; a.download=file.name+'.enc'; a.textContent='ダウンロード'; a.style.display='inline';
    log(document.getElementById('logB'),'暗号化完了');
  }catch(e){
    setProgress('progressB',0);
    log(document.getElementById('logB'),'エラー: '+e);
  }
};
document.getElementById('decB').onclick=async()=>{
  if (!piReady) { alert('Pi ヘックス列の生成がまだ完了していません。しばらくお待ちください。'); return; }
  const file=document.getElementById('fileB').files[0];
  if(!file) return alert('ファイルを選択');
  const pwd=document.getElementById('pwdB').value;
  if(!pwd) return alert('パスワードを入力');
  setProgress('progressB',0);
  try{
    const arrayBuf = await readFileAsArrayBufferWithProgress(file, p=>setProgress('progressB',p));
    const hdr=parseHeader(arrayBuf);
    if(hdr.mode!==1) throw new Error('Not mode B');
    const key=await deriveKey(pwd,hdr.salt);
    const pt=await decryptAES(key,hdr.iv,arrayBuf.slice(35),arrayBuf.slice(0,35));
    setProgress('progressB',100);
    const blob=new Blob([pt]);
    const url=URL.createObjectURL(blob);
    const a=document.getElementById('dlB');
    a.href=url; a.download=file.name.replace(/\.enc$/,'')+'.dec'; a.textContent='ダウンロード'; a.style.display='inline';
    log(document.getElementById('logB'),'復号化完了');
  }catch(e){
    setProgress('progressB',0);
    log(document.getElementById('logB'),'エラー: パスワードが違うか、ファイルが改ざんされています');
  }
};

// Self test

  logEl.innerHTML='';

  try{
    const plain=new TextEncoder().encode('self-test');

    const header=makeHeader(1,0,salt,iv);
    const key=await deriveKey('testpass',salt);
    const ct=await encryptAES(key,iv,plain,header);

// Attack demo for mode A
document.getElementById('attackBtnA').onclick=async()=>{
  if (!piReady) { alert('Pi ヘックス列の生成がまだ完了していません。しばらくお待ちください。'); return; }
  const logEl=document.getElementById('attackLog');
  logEl.textContent='';
  const fileInput=document.createElement('input');
  fileInput.type='file';
  fileInput.accept='.*';
  fileInput.onchange=async()=>{
    const file=fileInput.files[0];
    if(!file) return;
    const arrayBuf=await file.arrayBuffer();
    try{
      const hdr=parseHeader(arrayBuf);
      if(hdr.mode!==0) { logEl.textContent='モードAの暗号文ではありません。'; return; }
      const ciphertext=arrayBuf.slice(35);
      // Known plaintext candidates
      const candidates=[
        {name:'PNG', bytes:[0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A]},
        {name:'PDF', bytes:[0x25,0x50,0x44,0x46,0x2D]},
        {name:'ZIP', bytes:[0x50,0x4B,0x03,0x04]},
        {name:'JPEG', bytes:[0xFF,0xD8,0xFF]},
        {name:'GZIP', bytes:[0x1F,0x8B,0x08]}
      ];
      let found=false;
      for(const cand of candidates){
        if(ciphertext.length < cand.bytes.length) continue;
        const ksPart=new Uint8Array(cand.bytes.length);
        for(let i=0;i<cand.bytes.length;i++) ksPart[i]=ciphertext[i] ^ cand.bytes[i];
        const ksHex=ab2hex(ksPart);
        // Search offset
        const maxOffset=8191;
        let foundOffset=-1;
        for(let s=0;s<=maxOffset;s++){
          const need=ksPart.length*2;
          const start=s*2;
          if(start+need>piHexCache.length) break;
          const piPart=piHexCache.substr(start,need);
          if(piPart===ksHex){
            foundOffset=s;
            break;
          }
        }
        if(foundOffset>=0){
          logEl.textContent+=`既知平文 ${cand.name} からオフセット s=${foundOffset} を特定。\\n`;
          // Decrypt whole file with found offset
          const pt=encryptPiXOR(ciphertext,foundOffset);
          const blob=new Blob([pt]);
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url; a.download=file.name.replace(/\.enc$/,'')+'.dec'; a.textContent='ダウンロード復号ファイル'; a.style.display='block';
          logEl.appendChild(document.createElement('br'));
          logEl.appendChild(a);
          found=true;
          break;
        }
      }
      if(!found) logEl.textContent='既知平文からオフセットを見つけられませんでした。';
    }catch(e){
      logEl.textContent='エラー: '+e;
    }
  };
  fileInput.click();
};

    const plain2=new TextEncoder().encode('Hello reuse test 2');

    const xored=xor(ct1,ct2);

    }else{
      logEl.textContent='失敗: 一致しません。';
    }

}
